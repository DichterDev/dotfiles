# INTERFACE

# WATCH LATER
save-position-on-quit=yes

# TERMINAL
msg-color=yes
msg-module=yes

# YOUTUBE
ytdl-raw-options=extractor-args="youtube:player_client=mweb,android"
ytdl-format=bestvideo[format_note!*=AI-upscaled]+bestaudio/bestvideo+bestaudio/best
# ytdl-format=bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/bestvideo+bestaudio/best		
hls-bitrate=max															
demuxer-max-bytes=200MiB
demuxer-max-back-bytes=50MiB

# VIDEO
hwdec=auto-safe
gpu-api=opengl
# profile=fast
# profile=high-quality


# AUDIO
audio-file-auto=fuzzy
volume-max=150
alang=de,ger,eng,en,enUS,en-US
slang=

# SUBTITLE
sub-auto=fuzzy 															
sub-ass-override=force													
sub-use-margins=no														
sub-font="Segoe UI Semibold"											
sub-font-size=32														
sub-border-size=2
sub-back-color="#000000"
sub-shadow-offset=1
sub-clear-on-seek


[loop short videos]
profile-cond=duration < 15
profile-restore=copy
loop-file=inf

[extension.avif]
image-display-duration=inf
loop-file=inf
