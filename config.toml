pkgs = [
  "bat",
  "btop",
  "docker",
  "docker-buildx",
  "docker-compose",
  "eza",
  "fish",
  "fuzzel",
  "fzf",
  "kitty",
  "mpd",
  "mpv",
  "neovim",
  "niri",
  "quickshell",
  "starship",
  "wl-mirror",
  "yazi",
  "zellij",
  "zoxide",
  "zsh",
]

[services]
mpd = "--user mpd.service"
docker = "docker.service"

[home]
".bashrc" = "./bash/.bashrc"

[home.cache]

[home.config]
bat = "./bat/"
btop = "./btop/"
fish = "./fish/"
fuzzel = "./fuzzel/"
kitty = "./kitty/"
mpd = "./mpd/"
mpv = "./mpv/"
nvim = "./nvim/"
starship = "./starship/"
yazi = "./yazi/"
zellij = "./zellij/"

[home.local.bin]
"fix-mouse.sh" = "./scripts/fix-mouse.sh"

[home.local.share.applications]
"fix-mouse.desktop" = "./applications/fix-mouse.desktop"
"wl-mirror.desktop" = "./applications/wl-mirror.desktop"
