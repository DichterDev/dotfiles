input_tab_size           = 2
output_tab_size          = 2
indent_columns           = 4
indent_with_tabs         = 0
indent_align_string     = true
indent_class            = true
indent_switch_case      = 4
nl_enum_brace           = 1
nl_union_brace          = 1
nl_struct_brace         = 1
nl_do_brace             = 1
nl_if_brace             = 1
nl_else_brace           = 1
nl_for_brace            = 1
nl_while_brace          = 1
nl_switch_brace         = 1
nl_class_brace          = 1
nl_fdef_brace           = 1
sp_before_sparen        = force
sp_after_sparen         = remove
sp_inside_sparen        = remove
sp_before_squares       = remove
sp_before_comma         = remove
sp_after_comma          = force
sp_inside_paren         = remove
sp_after_cast           = force
code_width              = 100
nl_max                  = 2
nl_after_package        = 2
nl_after_import         = 2
nl_before_enum          = 2
nl_after_enum           = 2
align_right_assign_arrow = true
nl_func_call_start       = ignore
nl_func_call_empty       = remove
nl_func_call_end         = ignore
nl_func_call_start_multi_line = false
nl_func_call_end_multi_line   = false
nl_func_def_start_multi_line  = false
nl_func_def_end_multi_line    = false
indent_func_call_param   = true
indent_continue          = 4
indent_paren_close       = 0
indent_member            = 4
ls_func_split_full       = false
ls_for_split_full        = false
ls_if_split_full         = false
join_anon_func           = true
nl_assign_leave_one_liners = true
nl_if_leave_one_liners   = true
mod_sort_include        = true
nl_multi_line_define    = true
eat_blanks_before_close = true
eat_blanks_after_open  = true
